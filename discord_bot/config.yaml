name: "Discord Bot Host"
version: "0.2.3"
slug: discord_bot
description: "Bot Discord avec conversation et voix GLaDOS via Home Assistant."
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
options:
  discord_token: ""
  guild_id: ""
  ai_task_entity: ""
  assist_pipeline: ""
  allowed_discord_users: ""
schema:
  discord_token: password
  guild_id: str
  ai_task_entity: str?
  assist_pipeline: str?
  allowed_discord_users: str?
