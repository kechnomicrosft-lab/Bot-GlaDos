name: "Discord Bot Host"
version: "0.2.11"
slug: discord_bot
description: "Bot Discord avec conversation et voix GLaDOS via Home Assistant."
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
map:
  - type: media
    read_only: false
options:
  discord_token: ""
  guild_id: ""
  ai_task_entity: ""
  assist_pipeline: ""
  natural_text_triggers: false
  analyze_server_messages: false
  text_channel_ids: ""
  show_typing: true
  allow_emoji_reactions: true
  analyze_images: true
  context_minutes: 3
  context_entries: 6
  personality: ""
  tts_entity: "tts.piper"
  tts_language: "fr"
  tts_voice: "fr_FR-glados-medium"
  conversation_timezone: UTC
schema:
  discord_token: password
  guild_id: str
  ai_task_entity: str?
  assist_pipeline: str?
  natural_text_triggers: bool
  analyze_server_messages: bool
  text_channel_ids: str?
  show_typing: bool
  allow_emoji_reactions: bool
  analyze_images: bool
  context_minutes: int(1,30)
  context_entries: int(2,20)
  personality: str?
  tts_entity: str
  tts_language: str
  tts_voice: str?
  conversation_timezone: str
