name: "Discord Bot Host"
version: "0.2.9"
slug: discord_bot
description: "Bot Discord avec conversation et voix GLaDOS via Home Assistant."
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
map:
  - type: media
    read_only: false
options:
  discord_token: ""
  guild_id: ""
  ai_task_entity: ""
  assist_pipeline: ""
  natural_text_triggers: false
  analyze_server_messages: false
schema:
  discord_token: password
  guild_id: str
  ai_task_entity: str?
  assist_pipeline: str?
  natural_text_triggers: bool
  analyze_server_messages: bool
